services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is at host "db"
      DATABASE_URL: postgres://memorie:${DB_PASSWORD:-memorie}@db:5432/memorie
      MEDIA_ROOT: /app/media
    volumes:
      # Photos live on your server's own disk
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memorie
      POSTGRES_USER: memorie
      POSTGRES_PASSWORD: ${DB_PASSWORD:-memorie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorie -d memorie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
