<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Album</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-6">

<div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-10 text-center">

    <span class="material-symbols-outlined text-red-600 text-6xl mb-6">
        delete_forever
    </span>

    <h1 class="text-3xl font-bold mb-4">
        Delete Album?
    </h1>

    <p class="text-gray-600 mb-2">
        Are you sure you want to delete
    </p>

    <h2 class="text-xl font-semibold text-yellow-700 mb-6">
        "{{ album.title }}"
    </h2>

    <p class="text-gray-500 mb-8">
        This will permanently delete this album and every image inside it.
        This action cannot be undone.
    </p>

    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}

        <button
            type="submit"
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl flex items-center gap-2"
        >
            <span class="material-symbols-outlined">delete</span>
            Delete Album
        </button>

        <a
            href="{% url 'my_albums' %}"
            class="bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-xl flex items-center gap-2"
        >
            <span class="material-symbols-outlined">close</span>
            Cancel
        </a>

    </form>

</div>

</body>
</html>
